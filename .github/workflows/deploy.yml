name: Deploy to kaulraghav.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: python scripts/stamp_dates.py

      - run: npm run build

      - name: Push to kaulraghav.github.io
        run: |
          git clone https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/kaulraghav/kaulraghav.github.io.git _live
          rm -rf _live/*
          cp -r dist/. _live/
          cd _live
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin master
